name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile backend and tests
        run: |
          mkdir out
          javac -d out backend/src/main/java/adstore/*.java backend/src/test/java/adstore/*.java

      - name: Run the DSA tests (graph vs brute force)
        run: java -cp out adstore.AdEventStoreTest

      - name: Run the worked example from the report
        run: java -cp out adstore.AdEventStore

      - name: Check the frontend scripts for syntax errors
        run: |
          node --check frontend/local-engine.js
          node --check frontend/api.js
          node --check frontend/app.js
